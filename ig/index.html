<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyout 가입하기</title>
<meta name="robots" content="noindex">
<meta name="description" content="Flyout 회원가입 페이지로 이동합니다">
<style>
  :root{ --bg:#FFFFFF; --grey:#F2F4F6; --grey2:#E5E8EB; --ink:#191F28; --sub:#4E5968; --dim:#8B95A1; --blue:#8B5CF6; --blue-soft:#F1EBFF; --blue-ink:#6A3DE8; }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:420px;margin:0 auto;padding:48px 20px 40px;text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand img{height:40px;width:auto;display:block}
  h1{font-size:22px;line-height:1.4;font-weight:800;letter-spacing:-.02em;margin:28px 0 8px}
  p{margin:0;color:var(--sub);font-size:15px}
  .spin{width:28px;height:28px;border:3px solid var(--grey2);border-top-color:var(--blue);border-radius:50%;margin:22px auto 0;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .how{margin-top:22px;padding:16px 18px;border-radius:14px;background:var(--blue-soft);color:var(--blue-ink);font-size:15px;font-weight:600;text-align:left}
  .btns{display:grid;gap:10px;margin-top:22px}
  .btn{display:block;width:100%;padding:15px 18px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;color:#fff;background:var(--blue);cursor:pointer}
  .btn.dark{background:var(--ink)}
  .btn.ghost{background:var(--grey);color:var(--ink)}
  .hint{margin-top:16px;color:var(--dim);font-size:13px}
  .link{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--grey);color:var(--sub);font-size:12px;word-break:break-all;text-align:left;user-select:all;-webkit-user-select:all}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/logo.png" alt="" onerror="this.style.display='none'">flyout</div>
  <h1 id="h">Flyout 가입 페이지로 이동 중…</h1>
  <p id="p">잠시만 기다려 주세요.</p>
  <div class="spin" id="spin"></div>
  <div id="guide" hidden>
    <div class="how" id="how"></div>
    <div class="btns">
      <button type="button" class="btn" id="ext" hidden></button>
      <button type="button" class="btn dark" id="copy">링크 복사</button>
      <a class="btn ghost" id="stay" href="https://flyout.fun/register">여기서 이메일로 가입하기</a>
    </div>
    <p class="hint" id="copied" hidden></p>
    <div class="link" id="linktext" hidden></div>
  </div>
  <noscript><p style="margin-top:20px"><a href="https://flyout.fun/register">Flyout 가입 페이지로 이동</a></p></noscript>
</div>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f4fb1501470e436fb1efa565cb4e738c"}'></script>
<script>
// Flyout 웹 가입 중간 페이지 (flyout.kr/<폴더>/). 폴더 이름 = 캠페인. 출처값(utm)을 붙여 flyout.fun/register 로 보낸다.
// 앱 안 브라우저(네이버·인스타·페북·틱톡·카톡 등)는 구글이 구글 로그인을 막으므로(403 disallowed_useragent) 기본 브라우저로 넘긴다.
//   카톡(kakaotalk://web/openExternal — 카카오 공식 지원 기능은 아님, 널리 쓰임)·라인(openExternalBrowser=1, 공식)은 앱이 스스로
//   넘겨주므로 바로 시도. 안드로이드 intent(크롬)·iOS 17+ x-safari-https(사파리)는 사용자 동작 없이 부르면 막힐 수 있고(크롬 공식
//   문서: 사용자 동작 없는 intent 는 외부 앱을 안 띄움) 앱이 못 받으면 오류 화면으로 바뀔 수 있어, 안내를 바로 보여주고 버튼으로만 넘긴다.
//   안내에는 메뉴에서 브라우저로 여는 법 + 링크 복사 + 여기서 이메일 가입 버튼.
// utm_content = 사용자가 탄 이동 경로(browser / chrome / safari / kakao / line / copy / inapp). 가입 페이지에 도착한 방문의 경로
//   표시일 뿐 탈출 성공률 자체는 아니다(실패 후 이탈은 가입 페이지 GA4에 안 남음).
(function () {
  var SIGNUP = 'https://flyout.fun/register';
  // 폴더별 출처값. 표에 없는 폴더는 폴더 이름이 캠페인·출처(매체 link). 어느 폴더든 ?m= 로 매체만 바꿀 수 있다(예: 광고면 paid_social).
  // /join/ 은 ?c=캠페인 &s=출처 &m=매체 로 임시 링크.
  var CONF = {
    ig: { source: 'instagram', medium: 'social', campaign: 'meta' },
    fb: { source: 'facebook', medium: 'social', campaign: 'meta' },
    meta: { source: 'meta', medium: 'social', campaign: 'meta', social: true },
    naver: { source: 'naver', medium: 'cafe', campaign: 'naver_cafe' }
  };
  function clean(v, n) { return String(v || '').replace(/[^A-Za-z0-9_\-.]/g, '').slice(0, n || 40); }
  var q = new URLSearchParams(location.search);
  var parts = location.pathname.replace(/\/index\.html$/i, '').replace(/\/+$/, '').split('/');
  var folder = clean(parts[parts.length - 1]);
  var conf = CONF[folder];
  var campaign, source, medium;
  if (conf) {
    campaign = conf.campaign; source = conf.source; medium = clean(q.get('m'), 20) || conf.medium;
  } else {
    campaign = clean(q.get('c')) || (folder && folder !== 'join' ? folder : 'direct');
    source = clean(q.get('s'), 20) || campaign.split(/[_\-]/)[0] || 'direct';
    medium = clean(q.get('m'), 20) || 'link';
  }

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = !isIOS && /Android/i.test(ua);
  var iosMajor = (ua.match(/OS (\d+)_\d+/) || [])[1];
  iosMajor = iosMajor ? parseInt(iosMajor, 10) : 0;
  // 어느 앱 안의 브라우저인지 (앱 표시가 없어도 안드로이드 웹뷰 "; wv)", 사파리 표시 없는 아이폰 웹뷰는 앱 안으로 본다.
  // 크롬 커스텀 탭·SFSafariViewController 는 일반 브라우저 UA 라 통과 — 구글도 허용하는 방식)
  var app = '';
  if (isIOS || isAndroid) {
    app = /KAKAOTALK/i.test(ua) ? 'kakao'
      : /\bLine\//i.test(ua) ? 'line'
      : /NAVER\(inapp|NaverCafe/i.test(ua) ? 'naver'
      : /Instagram/i.test(ua) ? 'instagram'
      : /FBAN|FBAV|FB_IAB|FB4A|FBIOS|FBSS/i.test(ua) ? 'facebook'
      : /TikTok|musical_ly|BytedanceWebview|trill_/i.test(ua) ? 'tiktok'
      : /BAND\//i.test(ua) ? 'band'
      : /DaumApps|KAKAOSTORY/i.test(ua) ? 'daum'
      : (isAndroid && /; wv\)/.test(ua)) ? 'webview'
      : (isIOS && !/Safari\//.test(ua)) ? 'webview'
      : '';
  }
  // 메타 통합 링크(/meta/)는 인스타/페북을 나눠 본다: 주소의 s= → 앱 표시 → 리퍼러 순. 알아낸 값은 주소(s=)에 남겨,
  // 앱 메뉴의 '브라우저로 열기'로 이 페이지가 다시 열려도 유지되게 한다. (정확히 나누려면 /ig/ · /fb/ 링크를 따로 쓴다)
  if (conf && conf.social) {
    var pinned = clean(q.get('s'), 20), ref = document.referrer || '';
    source = /^(instagram|facebook)$/.test(pinned) ? pinned
      : (app === 'instagram' || app === 'facebook') ? app
      : /instagram\./i.test(ref) ? 'instagram'
      : /facebook\.|fb\.me|fb\.com/i.test(ref) ? 'facebook'
      : conf.source;
    if (source !== conf.source && pinned !== source) {
      try { var here = new URL(location.href); here.searchParams.set('s', source); history.replaceState(history.state, '', here.href); } catch (e) {}
    }
  }

  // 메타가 광고 클릭 주소에 붙이는 fbclid 를 가입 페이지로 그대로 넘긴다 — 가입 페이지의 메타 픽셀이 이걸 쿠키(_fbc)로 남겨
  // 앱 안 브라우저 → 크롬·사파리로 넘어가 가입해도 광고 클릭과 가입을 잇는다(2026-10-06 메타 픽셀 추가)
  var fbclid = String(q.get('fbclid') || '').replace(/[^A-Za-z0-9_\-]/g, '').slice(0, 500);
  function target(route) {
    return SIGNUP + '?utm_source=' + encodeURIComponent(source) + '&utm_medium=' + encodeURIComponent(medium)
      + '&utm_campaign=' + encodeURIComponent(campaign) + '&utm_content=' + route + (fbclid ? '&fbclid=' + fbclid : '');
  }
  var navs = [];
  function nav(url) { navs.push(url); try { location.href = url; } catch (e) {} }
  window.__bridge = { campaign: campaign, source: source, medium: medium, app: app, isIOS: isIOS, isAndroid: isAndroid, iosMajor: iosMajor, navs: navs, guide: false };

  var escapeUrl = '', extLabel = '', howText = '', auto = false;
  if (app === 'kakao') {
    escapeUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target('kakao')); auto = true;
    extLabel = '기본 브라우저로 열기';
    howText = '구글 계정으로 가입하려면 기본 브라우저에서 열어 주세요. 열리지 않으면 오른쪽 아래 ··· 메뉴에서 \'다른 브라우저로 열기\'를 눌러 주세요.';
  } else if (app === 'line') {
    escapeUrl = target('line') + '&openExternalBrowser=1'; auto = true;
    extLabel = '기본 브라우저로 열기';
    howText = '구글 계정으로 가입하려면 기본 브라우저에서 열어 주세요. 열리지 않으면 ··· 메뉴에서 \'기본 브라우저로 열기\'를 눌러 주세요.';
  } else if (app && isAndroid) {
    // 크롬이 없거나 앱이 못 넘기면 이 안내 페이지로 되돌아온다(가입 페이지로 바로 가면 또 구글 로그인이 막힘)
    escapeUrl = 'intent://' + target('chrome').replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='
      + encodeURIComponent(location.href) + ';end';
    extLabel = 'Chrome으로 열기';
    howText = '아래 \'Chrome으로 열기\'를 누르면 Chrome에서 가입 화면이 열려요. 열리지 않으면 ··· 메뉴에서 \'다른 브라우저로 열기\'를 눌러 주세요.';
  } else if (app && isIOS) {
    escapeUrl = iosMajor >= 17 ? 'x-safari-' + target('safari') : '';
    extLabel = 'Safari로 열기';
    howText = escapeUrl
      ? '아래 \'Safari로 열기\'를 누르면 Safari에서 가입 화면이 열려요. 열리지 않으면 화면의 ··· 메뉴에서 \'Safari로 열기\'(또는 \'외부 브라우저로 열기\')를 눌러 주세요.'
      : '화면의 ··· 메뉴에서 \'Safari로 열기\'(또는 \'외부 브라우저로 열기\')를 눌러 주세요.';
  }

  function showGuide() {
    if (window.__bridge.guide) return;
    window.__bridge.guide = true;
    document.getElementById('spin').hidden = true;
    document.getElementById('h').textContent = '브라우저에서 열어 주세요';
    document.getElementById('p').textContent = '지금 화면은 앱 안의 브라우저라 구글 로그인이 막혀 있어요. 이메일 가입은 여기서도 돼요.';
    document.getElementById('how').textContent = howText;
    var ext = document.getElementById('ext');
    if (escapeUrl) { ext.textContent = extLabel; ext.hidden = false; ext.onclick = function () { nav(escapeUrl); }; }
    var stay = document.getElementById('stay');
    stay.href = target('inapp');
    stay.onclick = function (e) { e.preventDefault(); nav(target('inapp')); };
    document.getElementById('copy').onclick = copyLink;
    document.getElementById('guide').hidden = false;
  }
  function copyLink() {
    var link = target('copy');
    var msg = document.getElementById('copied');
    function done(ok) {
      msg.hidden = false;
      msg.textContent = ok ? '링크를 복사했어요. 브라우저 주소창에 붙여 넣어 주세요.' : '아래 링크를 길게 눌러 복사해 주세요.';
      var box = document.getElementById('linktext'); box.textContent = link; box.hidden = ok;
    }
    function fallback() {
      var ok = false;
      try {
        var ta = document.createElement('textarea');
        ta.value = link; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, link.length);
        ok = document.execCommand('copy'); document.body.removeChild(ta);
      } catch (e) { ok = false; }
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  // 앱 안(카톡·라인 제외)은 안내를 바로 보여준다 — 넘어가는 건 사용자가 버튼을 눌렀을 때만
  if (app && !auto) showGuide();
  var started = false;
  function go() {
    if (started) return; started = true;
    if (!app) { navs.push(target('browser')); location.replace(target('browser')); return; }
    if (auto) { nav(escapeUrl); setTimeout(showGuide, 1200); }
  }
  // 방문 집계(비콘)가 나간 뒤 이동: load 후 300ms, 늦어도 1.5초
  window.addEventListener('load', function () { setTimeout(go, 300); });
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
