<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>플라이아웃 비밀 게시물 활용법</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0B10" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="flyout">
<meta property="og:title" content="플라이아웃 비밀 게시물 활용법">
<meta property="og:url" content="https://flyout.kr/secret/">
<meta property="og:image" content="https://flyout.kr/secret/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="img/01.webp" fetchpriority="high">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 슬라이드(구글 '비밀 게시물 활용법_원본')를 단계마다 반쪽으로 잘라 그대로 보여 준다.
     그림 다시 만들기 = flyout-marketing/scripts/secret_guide_build.py
     반경 규칙: 단계 상자 20px 하나 (flyout.kr/creator 와 같음) */
  :root{
    color-scheme: light dark;
    --bg:#F2F4F6; --ink:#191F28; --line:#E5E8EB; --card:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0C0B10; --ink:#F5F3F8; --line:#2C2933; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  img{display:block}

  .wrap{max-width:560px;margin:0 auto;padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
  header{padding:4px 8px 22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em}
  .brand img{height:34px;width:auto}
  h1{margin:26px 0 0;font-size:clamp(25px,6.6vw,32px);line-height:1.3;font-weight:800;letter-spacing:-.03em;word-break:keep-all;text-wrap:balance}

  .steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .steps li{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .steps img{width:100%;height:auto}

  @media (min-width:820px){
    .wrap{max-width:1120px;padding:28px 24px 64px}
    header{padding:0 4px 30px}
    h1{margin-top:30px}
    .steps{grid-template-columns:1fr 1fr;gap:16px}
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand"><img src="/logo.png" alt="flyout 로고" width="91" height="86">flyout</div>
    <h1>플라이아웃 비밀 게시물 활용법</h1>
  </header>
  <ol class="steps">
    <li><img src="img/01.webp" width="1111" height="1203" fetchpriority="high" alt="1. 올릴 사진이나 영상 선택, 비밀 게시물 체크"></li>
    <li><img src="img/02.webp" width="1111" height="1203" alt="2. 유료 게시물도 가능! 수위에 맞게 체크 후 게시 (예약도 가능)"></li>
    <li><img src="img/03.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="3. 홈 - 비밀 게시물 탭에서 확인 가능!"></li>
    <li><img src="img/04.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="4. 공유 상태 확인 가능! (공유하기 전에는 나에게만 보여요)"></li>
    <li><img src="img/05.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="5. DM(메세지)으로 비밀 게시물 보내기. 하단 +버튼 누르고 ‘게시물’ 선택"></li>
    <li><img src="img/06.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="6. 비밀로 보내고 싶은 게시물 클릭!"></li>
    <li><img src="img/07.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="7. 이렇게 전송돼요! (구매 전에는 블러 상태로 보여요)"></li>
    <li><img src="img/08.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="8. 구매하면 알림이 와요"></li>
    <li><img src="img/09.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="9. 라이브 시청자 전체에게 DM으로 보내기. 비밀 게시물 탭에서 보낼 게시물 클릭!"></li>
    <li><img src="img/10.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="10. 시청자에게 보내기!"></li>
    <li><img src="img/11.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="11. 확인 문구가 나오면 보내기 클릭!"></li>
    <li><img src="img/12.webp" width="1111" height="1203" loading="lazy" decoding="async" alt="12. 라이브 시청자들에게 한방에 보내기 완료~!"></li>
  </ol>
</main>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f4fb1501470e436fb1efa565cb4e738c"}'></script>
</body>
</html>
