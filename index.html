:root{color-scheme:dark;--bg:#0c0b10;--panel:#121117;--raised:#1d1b24;--raised-hover:#25222f;--selected:#292335;--bubble:#211e28;--sent:#3b334d;--line:#2c2933;--text:#f5f3f8;--muted:#b3aebd;--soft:#8f899c;--accent:#b69cf2;--accent-hover:#c5aff8;--ink:#171120;--max:1440px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;scrollbar-gutter:stable;background:var(--bg)}
body{margin:0;color:var(--text);background:var(--bg);font-family:FlyoutPreview,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
body.dialog-open{overflow:hidden}
button,a,input{-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default}
button{color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
button:active:not(:disabled),.primary:active{transform:translateY(1px)}
button{transition:background .15s,color .15s,transform .15s}
.icon{display:block;width:22px;height:22px;flex:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.shell{max-width:var(--max);margin-inline:auto;padding-inline:28px}
.topbar{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:23px;font-weight:850;letter-spacing:-.8px;background:none;border:0;padding:8px 0}
.brand img{width:29px;height:29px;border-radius:7px;object-fit:contain}

.preview-label{padding:5px 10px;border:1px solid #3a324a;border-radius:7px;color:#c8badf;font-size:12px;white-space:nowrap}
.view{padding-block:40px 48px}
.view:focus{outline:none}
#creators-title:focus{outline:none}
.view.arrive{animation:arrive .24s ease-out both}
@keyframes arrive{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.primary,.secondary{border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 22px;font-size:16px;font-weight:750;white-space:nowrap}
.primary{background:var(--accent);color:var(--ink)}
.primary:hover{background:var(--accent-hover)}
.primary:disabled,.primary[aria-disabled="true"]{background:#302a3d;color:#b2a6c5;pointer-events:none}
.secondary{background:var(--raised);border:1px solid var(--line);color:var(--text)}
.secondary:hover{background:var(--raised-hover)}
.photo{--tone:#24202e;--photo-mark:#b6a7d0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--tone);color:var(--photo-mark);width:100%;isolation:isolate}
.photo-error{font-size:13px;color:var(--muted)}
.photo[data-photo="1"]{background:color-mix(in srgb,var(--tone) 70%,#514958)}
.photo[data-photo="2"]{background:color-mix(in srgb,var(--tone) 75%,#3a4146)}
.photo[data-photo="3"]{background:color-mix(in srgb,var(--tone) 72%,#494350)}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.footer{min-height:60px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:var(--soft);padding-block:16px}
.footer .legal{display:flex;gap:16px}
.footer a:hover{text-decoration:underline;color:var(--text)}
.view-head{margin-bottom:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
h2,.screen-title{margin:0;font-size:32px;line-height:1.3;font-weight:750;letter-spacing:-1.1px}
.view-head p{margin:0;color:var(--muted);font-size:16px}
.creator-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.creator-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.photo-stage{position:relative;touch-action:pan-y}
.photo-surface{width:100%;display:block;text-align:center}
.photo-carousel{overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.photo-track{position:relative;transform:translate3d(0,0,0)}
.photo-track.moving{will-change:transform}
.photo-track>.photo[data-slot="prev"],.photo-track>.photo[data-slot="next"]{position:absolute;top:0}
.photo-track>.photo[data-slot="prev"]{left:-100%}
.photo-track>.photo[data-slot="next"]{left:100%}
.creator-card .photo{aspect-ratio:3/4}
.photo-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:44px;border:0;border-radius:10px;background:rgba(12,11,16,.77);display:grid;place-items:center;color:#efebf5;z-index:1}
.photo-arrow:active:not(:disabled){transform:translateY(-50%) scale(.96)}
.photo-arrow:hover{background:#17131f}
.photo-arrow.prev{left:8px}.photo-arrow.next{right:8px}
.photo-arrow .icon{width:19px;height:19px}
.dots{display:flex;align-items:center;justify-content:center;gap:3px;height:31px;background:var(--panel)}
.dot{padding:0;border:0;background:transparent;width:27px;height:27px;display:grid;place-items:center}
.dot:after{content:'';height:3px;width:13px;border-radius:4px;background:#55505f;transition:background .15s}
.dot[aria-pressed="true"]:after{background:var(--accent)}
.creator-info{padding:3px 16px 17px}
.creator-info h2{font-size:18px;font-weight:750;letter-spacing:-.4px;margin:0 0 5px}
.creator-info p{font-size:14px;color:var(--muted);margin:0 0 17px;min-height:21px}
.creator-info .primary{width:100%;font-size:14px;padding-inline:8px;min-height:46px;gap:7px}
.creator-info .primary .icon{width:17px;height:17px}
.icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:12px;flex:none;color:var(--muted)}
.icon-button:hover{background:var(--raised);color:var(--text)}
dialog{background:#17141d;color:var(--text);border:1px solid #41384e;border-radius:20px;padding:0;width:min(510px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 24px 100px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.82)}
.no-js{padding:30px;border:1px solid var(--line);margin:20px;color:var(--text)}

.view{min-height:calc(100dvh - 141px)}
.creator-card{display:flex;flex-direction:column}
.creator-info{flex:1;display:flex;flex-direction:column}
.creator-info .primary{margin-top:auto}
.ios-notice{width:min(420px,calc(100vw - 32px));padding:28px}
.notice-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.notice-head h2{font-size:21px;letter-spacing:-.6px}
.notice-head .icon-button{width:36px;height:36px;border:0}
.notice-copy{font-size:16px;line-height:1.8;color:var(--text);margin:0 0 22px}
.notice-copy span{display:block}
.notice-help{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 18px}
.notice-primary{width:100%}
.notice-destination{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.copy-link{margin-top:10px;background:none;border:0;color:var(--muted);width:100%;min-height:42px;font-size:13px;text-decoration:underline;text-underline-offset:4px}
.copy-status{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* Five equal cards on desktop; natural vertical reading order on mobile. */
.creator-info{padding:7px 16px 18px;gap:16px}
.creator-info h2{font-size:20px;margin:0}
.creator-info .primary{font-size:14px;min-height:48px}
.photo-count{position:absolute;top:12px;right:12px;padding:4px 9px;border-radius:20px;background:rgba(12,11,16,.72);color:#fff;font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
@media(max-width:1199px){.creator-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.shell{padding-inline:24px}}
@media(max-width:899px){.creator-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){
 .shell{padding-inline:20px}.topbar{height:66px;gap:12px}.brand{font-size:21px}.brand img{width:25px;height:25px}
 .preview-label{font-size:11px;padding:4px 8px}.view{padding-block:28px 36px}
 .footer{font-size:11px;align-items:flex-start;flex-direction:column;gap:7px}
 .view-head{gap:10px;margin-bottom:25px}.screen-title{font-size:27px}.view-head p{font-size:14px;line-height:1.7}
 .creator-grid{grid-template-columns:minmax(0,1fr);gap:28px}
 .creator-card .photo{aspect-ratio:3/4;max-height:65svh}.creator-info{padding:8px 18px 20px;gap:16px}.creator-info h2{font-size:21px}
 .creator-info .primary{font-size:15px;min-height:50px}.photo-arrow{width:38px;height:46px}.photo-arrow.prev{left:10px}.photo-arrow.next{right:10px}.photo-arrow .icon{width:20px;height:20px}
 .ios-notice{padding:24px}
}
@media(max-width:374px){.shell{padding-inline:16px}.screen-title{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<style>
/* Approved production layout, 2026-10-23. Existing Flyout palette and real creator assets.
   DESIGN_VARIANCE: 5; MOTION_INTENSITY: 3; VISUAL_DENSITY: 3.
   Desktop: one selected portrait, introductory copy and a compact creator picker.
   Mobile: preserve the approved vertical photo feed without visual changes.
   Photo navigation and attribution keep the verified production implementation. */
:root{--max:1360px}
.shell{padding-inline:32px}
.topbar{height:72px}
.brand{font-size:24px}
.view{padding-block:38px 36px;min-height:calc(100svh - 134px)}
.view-head{position:relative;padding-right:120px;gap:11px;margin-bottom:28px}
.screen-title{font-size:clamp(30px,3vw,40px);letter-spacing:-1.5px;font-weight:750}
.view-head p{font-size:16px;color:#bdb7c8}
.creator-browse{display:flex;gap:10px;position:absolute;right:0;bottom:0}
.creator-browse button{width:45px;height:45px;border:1px solid #46404f;border-radius:50%;background:#18151e;display:grid;place-items:center}
.creator-browse button:hover:not(:disabled){background:#2a2434;border-color:#b69cf2}
.creator-browse button:disabled{opacity:.3}
.creator-grid{display:flex;gap:24px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 0 8px;overscroll-behavior-x:contain}
.creator-grid::-webkit-scrollbar{display:none}
.creator-card{flex:0 0 clamp(380px,42vw,550px);position:relative;display:block;scroll-snap-align:start;border:0;border-radius:22px;background:#1b1723;isolation:isolate}
.creator-card .photo{aspect-ratio:auto;height:clamp(480px,calc(100svh - 252px),680px);max-height:none;background:#211b2a}
.creator-card .photo img{object-position:center 40%}
.photo-stage{height:100%}
.photo-count{display:none}
.photo-arrow{top:44%;width:38px;height:44px;border-radius:50%;background:rgba(12,11,16,.58);border:1px solid rgba(255,255,255,.15)}
.photo-arrow.prev{left:16px}.photo-arrow.next{right:16px}
.creator-card>.dots{position:absolute;z-index:2;left:22px;right:22px;top:12px;display:flex;gap:5px;height:36px;background:transparent}
.creator-card>.dots .dot{flex:1;height:36px;min-width:24px;width:auto}
.creator-card>.dots .dot:after{height:3px;width:100%;background:rgba(255,255,255,.34);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.creator-card>.dots .dot[aria-pressed=true]:after{background:#fff}
.creator-card>.dots .dot:focus-visible{outline-offset:0;border-radius:4px}
.creator-info{position:absolute;inset:auto 0 0;z-index:1;display:flex;flex-direction:column;gap:18px;padding:100px 26px 26px;background:linear-gradient(transparent,rgba(12,9,17,.8) 48%,rgba(12,9,17,.98));pointer-events:none}
.creator-info h2{font-size:34px;line-height:1.25;letter-spacing:-1px;font-weight:750;text-shadow:0 2px 12px rgba(0,0,0,.45);color:#fff;margin:0}
.creator-info .primary{pointer-events:auto;min-height:54px;padding:15px 18px;border-radius:12px;font-size:16px;font-weight:750;background:#c2a7fb;color:#1a1128;margin-top:0}
.creator-info .primary:hover{background:#d3bcff}
.creator-info .primary:focus-visible{outline-color:#fff;outline-offset:3px}
.footer{min-height:62px;font-size:12px}
@media(min-width:768px) and (max-height:760px){.view{padding-top:24px}.view-head{margin-bottom:22px}.creator-card .photo{height:clamp(370px,calc(100svh - 230px),500px)}}
@media(max-width:767px){
 .shell{padding-inline:18px}
 .topbar{height:60px}.brand{font-size:22px}.brand img{width:25px;height:25px}
 .view{padding-block:23px 30px}
 .view-head{padding-right:0;gap:8px;margin-bottom:22px}
 .screen-title{font-size:28px;letter-spacing:-1.1px;line-height:1.3}
 .view-head p{font-size:14px;line-height:1.65;max-width:340px}
 .creator-browse{display:none}
 .creator-grid{display:flex;flex-direction:column;gap:20px;overflow:visible;padding:0;scroll-snap-type:none}
 .creator-card{flex:initial;width:100%;border-radius:18px}
 .creator-card .photo{height:clamp(380px,calc(100svh - 260px),690px);max-height:none;aspect-ratio:auto}
 .creator-card>.dots{left:18px;right:18px;top:9px}
 .creator-info{gap:15px;padding:90px 20px 20px}
 .creator-info h2{font-size:30px}
 .creator-info .primary{font-size:15px;min-height:52px}
 .photo-arrow{width:34px;height:40px}.photo-arrow.prev{left:12px}.photo-arrow.next{right:12px}
 .photo-arrow .icon{width:18px;height:18px}
 .footer{padding-block:20px}
}
@media(max-width:359px){.shell{padding-inline:14px}.screen-title{font-size:25px}.creator-info{padding-inline:16px}}
@media(prefers-reduced-motion:reduce){.creator-grid{scroll-behavior:auto}}
.creator-picker{display:none}
/* IMG_8796 is landscape: fit the complete original above the contact controls.
   A subdued copy fills the spare frame; only the backdrop is cropped/blurred. */
.creator-card .photo.fit-original{background:#17131d}
.creator-card .photo.fit-original:before{content:'';position:absolute;inset:-24px;background-image:var(--photo-backdrop);background-position:center;background-size:cover;filter:blur(24px) saturate(.7);opacity:.3;pointer-events:none}
.creator-card .photo.fit-original img{inset:18px 0 auto;width:100%;height:calc(100% - 162px);object-fit:contain;object-position:center;z-index:1}
@media(min-width:768px){
 :root{--max:1200px;--spot-height:clamp(430px,calc(100svh - 210px),660px);--spot-width:calc(var(--spot-height)*.68)}
 .view{display:grid;grid-template-columns:minmax(210px,1fr) minmax(0,var(--spot-width)) 146px;gap:36px;align-items:center;padding-block:32px 38px}
 .view-head{padding:0;margin:0;gap:20px;align-self:center}
 .screen-title{font-size:40px;line-height:1.4;letter-spacing:-1.5px}
 .view-head p{max-width:255px;font-size:15px;line-height:1.9;color:#bdb7c8}
 .creator-grid{display:block;min-width:0;width:100%;overflow:visible;scroll-snap-type:none;padding:0}
 .creator-card{display:block;width:100%;border:1px solid #39323f;border-radius:22px;background:#151219}
 .creator-card:not(.is-current){display:none}
 .creator-card .photo{height:var(--spot-height);max-height:none;aspect-ratio:auto}
 .creator-info{padding:100px 24px 24px;gap:18px}
 .creator-info h2{font-size:32px}
 .creator-info .primary{min-height:54px;font-size:15px}
 .creator-picker{display:flex;flex-direction:column;gap:10px;min-width:0;align-self:center}
 .creator-choice{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:#c5bece}
 .creator-choice:hover{background:#1d1825;color:#fff}
 .creator-choice[aria-pressed=true]{border-color:#b69cf2;background:#282031;color:#fff}
 .creator-choice img{display:block;flex:none;width:43px;height:58px;object-fit:cover;object-position:center 40%;border-radius:7px}
 .creator-choice span{font-size:14px;font-weight:650;white-space:nowrap}
}
@media(min-width:768px) and (max-width:1099px){
 :root{--spot-height:clamp(400px,calc(100svh - 264px),620px)}
 .view{grid-template-columns:minmax(0,1fr) 146px;gap:24px 32px;max-width:760px;margin-inline:auto;padding-block:24px 30px;align-items:start}
 .view-head{grid-column:1 / -1;gap:10px;margin:0}
 .view-head p{max-width:none;line-height:1.6}
 .screen-title{font-size:32px;line-height:1.3}
 .creator-grid{grid-column:1;grid-row:2;max-width:var(--spot-width);justify-self:center}
 .creator-picker{grid-column:2;grid-row:2;align-self:center}
}

</style>
</head>

    try{await navigator.clipboard.writeText(linksFor(c).web);$('copy-status').textContent='복사했어요. Safari 주소창에 붙여 넣어 주세요.';track('signup_link_copy',{creator_id:c.id});}
    catch{$('copy-status').textContent='확인 버튼을 길게 눌러 링크를 복사해 주세요.';}
  };
  $('brand-home').onclick=()=>{window.scrollTo({top:0,behavior:'instant'});$('creators-title').focus({preventScroll:true});};
  window.addEventListener('pageshow',()=>{state.navigating=false;});
  window.FlyoutPreview=Object.freeze({creators:CREATORS,events,linksFor:id=>{const c=CREATORS.find(c=>c.id===id);return c?linksFor(c):null;},
    context:Object.freeze({source,medium,campaign,isIOS,isAndroid,inApp,device,ga4Enabled:GA4.enabled,measurementId:GA4.measurementId})});
  // Local previews never send analytics; HTTPS production host gating is above.
  initAnalytics();buildCards();track('landing_view',{client_platform:device});
})();
</script>

<script>
// A desktop creator picker reuses the original cards and attributed CTA links.
// CSS shows every original card again on mobile; no alternate signup handler.
(() => {
  const creators=window.FlyoutPreview.creators;
  const cards=Array.from(document.querySelectorAll('.creator-card'));
  const picker=document.createElement('nav');
  picker.className='creator-picker';picker.setAttribute('aria-label','크리에이터 선택');
  const heading=document.getElementById('creators-title'),originalHeading=heading.textContent;
  const wide=matchMedia('(min-width: 1100px)');
  function choose(index){
    cards.forEach((card,i)=>card.classList.toggle('is-current',i===index));
    picker.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  }
  creators.forEach((creator,index)=>{
    const button=document.createElement('button');button.type='button';button.className='creator-choice';
    button.setAttribute('aria-label',creator.name+' 선택');
    const picture=document.createElement('img');picture.src=creator.photos[0];picture.alt='';picture.decoding='async';picture.draggable=false;
    const name=document.createElement('span');name.textContent=creator.name;
    button.append(picture,name);button.onclick=()=>choose(index);
    button.addEventListener('keydown',event=>{
      const next=event.key==='ArrowDown'?(index+1)%creators.length:event.key==='ArrowUp'?(index+creators.length-1)%creators.length:event.key==='Home'?0:event.key==='End'?creators.length-1:null;
      if(next===null)return;event.preventDefault();choose(next);picker.children[next].focus();
    });
    picker.append(button);
  });
  document.getElementById('view-creators').append(picker);
  function layout(){
    if(wide.matches)heading.replaceChildren(document.createTextNode('누구와'),document.createElement('br'),document.createTextNode('이야기해 볼까요?'));
    else heading.textContent=originalHeading;
  }
  wide.addEventListener('change',layout);layout();choose(0);
  document.getElementById('brand-home').addEventListener('click',()=>choose(0));
})();

</script>
