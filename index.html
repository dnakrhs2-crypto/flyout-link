:root{color-scheme:dark;--bg:#0c0b10;--panel:#121117;--raised:#1d1b24;--raised-hover:#25222f;--selected:#292335;--bubble:#211e28;--sent:#3b334d;--line:#2c2933;--text:#f5f3f8;--muted:#b3aebd;--soft:#8f899c;--accent:#b69cf2;--accent-hover:#c5aff8;--ink:#171120;--max:1440px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;scrollbar-gutter:stable;background:var(--bg)}
body{margin:0;color:var(--text);background:var(--bg);font-family:FlyoutPreview,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
body.dialog-open{overflow:hidden}
button,a,input{-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default}
button{color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
button:active:not(:disabled),.primary:active{transform:translateY(1px)}
button{transition:background .15s,color .15s,transform .15s}
.icon{display:block;width:22px;height:22px;flex:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.shell{max-width:var(--max);margin-inline:auto;padding-inline:28px}
.topbar{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:23px;font-weight:850;letter-spacing:-.8px;background:none;border:0;padding:8px 0}
.brand img{width:29px;height:29px;border-radius:7px;object-fit:contain}

.preview-label{padding:5px 10px;border:1px solid #3a324a;border-radius:7px;color:#c8badf;font-size:12px;white-space:nowrap}
.view{padding-block:40px 48px}
.view:focus{outline:none}
#creators-title:focus{outline:none}
.view.arrive{animation:arrive .24s ease-out both}
@keyframes arrive{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.primary,.secondary{border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 22px;font-size:16px;font-weight:750;white-space:nowrap}
.primary{background:var(--accent);color:var(--ink)}
.primary:hover{background:var(--accent-hover)}
.primary:disabled,.primary[aria-disabled="true"]{background:#302a3d;color:#b2a6c5;pointer-events:none}
.secondary{background:var(--raised);border:1px solid var(--line);color:var(--text)}
.secondary:hover{background:var(--raised-hover)}
.photo{--tone:#24202e;--photo-mark:#b6a7d0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--tone);color:var(--photo-mark);width:100%;isolation:isolate}
.photo:before{content:'';position:absolute;inset:16px;border:1px solid rgba(210,196,239,.12);border-radius:10px;pointer-events:none}
.photo .photo-letter{font-size:clamp(46px,6vw,72px);font-weight:400;letter-spacing:-3px;line-height:1;opacity:.6;position:relative}
.photo .photo-caption{margin-top:13px;font-size:12px;letter-spacing:0;color:#c0b7cf;position:relative}
.photo[data-photo="1"]{background:color-mix(in srgb,var(--tone) 70%,#514958)}
.photo[data-photo="2"]{background:color-mix(in srgb,var(--tone) 75%,#3a4146)}
.photo[data-photo="3"]{background:color-mix(in srgb,var(--tone) 72%,#494350)}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo.has-image:before{display:none}
.photo.has-image .photo-letter,.photo.has-image .photo-caption{display:none}
.footer{min-height:60px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:var(--soft);padding-block:16px}
.footer .legal{display:flex;gap:16px}
.footer a:hover{text-decoration:underline;color:var(--text)}
.view-head{margin-bottom:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
h2,.screen-title{margin:0;font-size:32px;line-height:1.3;font-weight:750;letter-spacing:-1.1px}
.view-head p{margin:0;color:var(--muted);font-size:16px}
.creator-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.creator-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.photo-stage{position:relative;touch-action:pan-y}
.photo-open{padding:0;width:100%;border:0;background:transparent;display:block;text-align:center}
.creator-card .photo{aspect-ratio:3/4}
.photo-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:44px;border:0;border-radius:10px;background:rgba(12,11,16,.77);display:grid;place-items:center;color:#efebf5;z-index:1}
.photo-arrow:active:not(:disabled){transform:translateY(-50%) scale(.96)}
.photo-arrow:hover{background:#17131f}
.photo-arrow.prev{left:8px}.photo-arrow.next{right:8px}
.photo-arrow .icon{width:19px;height:19px}
.dots{display:flex;align-items:center;justify-content:center;gap:3px;height:31px;background:var(--panel)}
.dot{padding:0;border:0;background:transparent;width:27px;height:27px;display:grid;place-items:center}
.dot:after{content:'';height:3px;width:13px;border-radius:4px;background:#55505f;transition:background .15s}
.dot[aria-pressed="true"]:after{background:var(--accent)}
.creator-info{padding:3px 16px 17px}
.creator-info h2{font-size:18px;font-weight:750;letter-spacing:-.4px;margin:0 0 5px}
.creator-info p{font-size:14px;color:var(--muted);margin:0 0 17px;min-height:21px}
.creator-info .primary{width:100%;font-size:14px;padding-inline:8px;min-height:46px;gap:7px}
.creator-info .primary .icon{width:17px;height:17px}
.sample-note{color:var(--soft);font-size:13px;text-align:center;margin:23px 0 0}
.icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:12px;flex:none;color:var(--muted)}
.icon-button:hover{background:var(--raised);color:var(--text)}
dialog{background:#17141d;color:var(--text);border:1px solid #41384e;border-radius:20px;padding:0;width:min(510px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 24px 100px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.82)}
.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 18px;border-bottom:1px solid var(--line)}
.gallery-head h2{font-size:18px;letter-spacing:-.3px}
.gallery-body{position:relative;touch-action:pan-y}
#gallery{width:min(var(--gallery-width,720px),calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:hidden}
.gallery-body .photo{height:var(--gallery-height,60dvh);min-height:0}
.gallery-body .photo:before{display:none}
.gallery-body .photo-letter{font-size:94px}
.gallery-body .photo-arrow{width:42px;height:48px}
.gallery-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;gap:10px}
.gallery-foot p{font-size:13px;color:var(--muted);margin:0}
.gallery-foot .dots{background:transparent}
.no-js{padding:30px;border:1px solid var(--line);margin:20px;color:var(--text)}

.view{min-height:calc(100dvh - 141px)}
.creator-card{display:flex;flex-direction:column}
.creator-info{flex:1;display:flex;flex-direction:column}
.creator-info .primary{margin-top:auto}
.ios-notice{width:min(420px,calc(100vw - 32px));padding:28px}
.notice-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.notice-head h2{font-size:21px;letter-spacing:-.6px}
.notice-head .icon-button{width:36px;height:36px;border:0}
.notice-copy{font-size:16px;line-height:1.8;color:var(--text);margin:0 0 22px}
.notice-copy span{display:block}
.notice-help{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 18px}
.notice-primary{width:100%}
.notice-destination{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.copy-link{margin-top:10px;background:none;border:0;color:var(--muted);width:100%;min-height:42px;font-size:13px;text-decoration:underline;text-underline-offset:4px}
.copy-status{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* Five equal cards on desktop; natural vertical reading order on mobile. */
.creator-info{padding:7px 16px 18px;gap:16px}
.creator-info h2{font-size:20px;margin:0}
.creator-info .primary{font-size:14px;min-height:48px}
.photo-count{position:absolute;top:12px;right:12px;padding:4px 9px;border-radius:20px;background:rgba(12,11,16,.72);color:#fff;font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none}
.gallery-body .photo{background:#0c0b10}
.gallery-body .photo img{object-fit:contain}
@media(max-width:1199px){.creator-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.shell{padding-inline:24px}}
@media(max-width:899px){.creator-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){
 .shell{padding-inline:20px}.topbar{height:66px;gap:12px}.brand{font-size:21px}.brand img{width:25px;height:25px}
 .preview-label{font-size:11px;padding:4px 8px}.view{padding-block:28px 36px}
 .footer{font-size:11px;align-items:flex-start;flex-direction:column;gap:7px}
 .view-head{gap:10px;margin-bottom:25px}.screen-title{font-size:27px}.view-head p{font-size:14px;line-height:1.7}
 .creator-grid{grid-template-columns:minmax(0,1fr);gap:28px}
 .creator-card .photo{aspect-ratio:3/4;max-height:65svh}.creator-info{padding:8px 18px 20px;gap:16px}.creator-info h2{font-size:21px}
 .creator-info .primary{font-size:15px;min-height:50px}.photo-arrow{width:38px;height:46px}.photo-arrow.prev{left:10px}.photo-arrow.next{right:10px}.photo-arrow .icon{width:20px;height:20px}
 .sample-note{font-size:12px;margin-top:25px}.gallery-head{padding:12px 15px}.ios-notice{padding:24px}
}
@media(max-width:374px){.shell{padding-inline:16px}.screen-title{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
